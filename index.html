<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="食事メーター">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f1ee">
<title>食事メーター</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one phone column. Today (meals as item tags + mood faces + daily summary), Review (food ranking first, then charts), Settings, bottom tab bar, bottom-sheet forms. */
:root {
  --bg: #f2f1ee;
  --surface: #fbfaf9;
  --surface2: #e9e8e4;
  --fg: #1b2220;
  --muted: #5f6966;
  --rule: #d8d6d0;
  --accent: #2c4db0;
  --accent-fg: #ffffff;
  --accent-soft: #dde4f7;
  --ok: #1d7a4d;
  --bad: #b3261e;
  --bad-soft: #f6dcd9;
  --dot-off: #a9aea9;
  --dot-s: 62%;
  --dot-l: 42%;
  --c1: #2c4db0;
  --c2: #b86e00;
  --c3: #0f8a78;
  --c4: #c23b63;
  --c5: #8a5cc2;
  --veil: rgba(10, 14, 12, 0.45);
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101514;
    --surface: #18201e;
    --surface2: #232d2a;
    --fg: #e6ecea;
    --muted: #95a39f;
    --rule: #2c3936;
    --accent: #8fa8ff;
    --accent-fg: #0b1233;
    --accent-soft: #222e5a;
    --ok: #62d39b;
    --bad: #ff8f86;
    --bad-soft: #3a1f1d;
    --dot-off: #55635f;
    --dot-s: 65%;
    --dot-l: 60%;
    --c1: #8fa8ff;
    --c2: #f0b44c;
    --c3: #4fd1bd;
    --c4: #ff8aa8;
    --c5: #c4a1ff;
    --veil: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101514;
  --surface: #18201e;
  --surface2: #232d2a;
  --fg: #e6ecea;
  --muted: #95a39f;
  --rule: #2c3936;
  --accent: #8fa8ff;
  --accent-fg: #0b1233;
  --accent-soft: #222e5a;
  --ok: #62d39b;
  --bad: #ff8f86;
  --bad-soft: #3a1f1d;
  --dot-off: #55635f;
  --dot-s: 65%;
  --dot-l: 60%;
  --c1: #8fa8ff;
  --c2: #f0b44c;
  --c3: #4fd1bd;
  --c4: #ff8aa8;
  --c5: #c4a1ff;
  --veil: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  padding-block: 16px 104px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.lock { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: 0.04em; }
h2 { font-size: 16px; margin: 0; font-weight: 700; }
h3 { font-size: 14px; margin: 0; font-weight: 700; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.status { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 500; white-space: nowrap; }
.status.bad { background: var(--bad-soft); color: var(--bad); }
.muted { color: var(--muted); }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.err { margin: 0; min-height: 1.3em; font-size: 13px; color: var(--bad); }
.msg { margin: 0; min-height: 1.3em; font-size: 13px; color: var(--ok); }
.msg.bad { color: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.notice { background: var(--accent-soft); color: var(--fg); border-radius: 12px; padding: 10px 14px; font-size: 13px; }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.empty { text-align: center; color: var(--muted); padding: 14px 8px; font-size: 14px; margin: 0; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: inherit; min-height: 32px; }

.primary { min-height: 50px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 16px; cursor: pointer; padding: 0 16px; width: 100%; }
.ghost { min-height: 44px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 0 14px; cursor: pointer; font-size: 14px; }
.ghost.danger { color: var(--bad); }
.ghost.armed { background: var(--bad-soft); color: var(--bad); font-weight: 700; border-color: var(--bad); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1 1 0; min-width: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.daynav { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
.nav { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-size: 14px; }
.daylabel { text-align: center; display: flex; flex-direction: column; align-items: center; line-height: 1.3; }
.daylabel .num { font-size: 16px; font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.stat small { display: block; font-size: 11px; color: var(--muted); }
.stat .num { font-size: 18px; font-weight: 600; }
.statface { display: flex; align-items: center; gap: 6px; }

.meal-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.time { font-family: var(--font-num); font-size: 15px; font-weight: 600; }
.carb { margin-left: auto; font-family: var(--font-num); font-size: 13px; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border-radius: 99px; background: var(--surface2); font-size: 14px; max-width: 100%; overflow-wrap: anywhere; }
.tags.edit .tag { min-height: 40px; padding: 0 2px 0 4px; }
.tag .tname { padding: 0 6px; overflow-wrap: anywhere; }
.tag button { min-width: 38px; min-height: 38px; border: 0; background: transparent; cursor: pointer; color: var(--muted); border-radius: 50%; font-size: 15px; }
.tag .tagstar[aria-pressed="true"] { color: var(--c2); }
.itemrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.checks { display: flex; flex-direction: column; gap: 6px; }
.check { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; text-align: left; width: 100%; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--rule); background: var(--bg); cursor: pointer; min-height: 44px; }
.check .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
.check .sc { font-family: var(--font-num); font-weight: 600; }
.check .note { grid-column: 1 / -1; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; }
.actions .ghost { flex: 1 1 0; min-width: 0; }

/* faces */
.face { display: block; width: 100%; height: auto; }
.face .bg { fill: none; stroke: var(--dot-off); stroke-width: 1.5; }
.face .e, .face .fm { fill: var(--dot-off); stroke: none; }
.face .f { fill: none; stroke: var(--dot-off); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.dot.on .face .bg, .face.on .bg { fill: var(--dotc); stroke: var(--dotc); }
.dot.on .face .e, .dot.on .face .fm, .face.on .e, .face.on .fm { fill: var(--accent-fg); }
.dot.on .face .f, .face.on .f { stroke: var(--accent-fg); }
.facebox { --dotc: hsl(var(--h, 0) var(--dot-s) var(--dot-l)); display: inline-block; flex: none; }
.scale { --dotc: hsl(var(--h, 0) var(--dot-s) var(--dot-l)); }
.dots { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); }
.dot { -webkit-appearance: none; appearance: none; background: none; border: 0; padding: 0; min-height: 44px; display: grid; place-items: center; cursor: pointer; }
.dot .face { width: min(28px, 94%); }
.dot:active .face { transform: scale(0.88); }
.ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.scalehead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.readout { font-family: var(--font-num); font-weight: 600; font-size: 15px; }
.readrow { display: flex; align-items: center; gap: 12px; }
.faceslot { width: 52px; height: 52px; flex: none; display: grid; place-items: center; }
.big { font-size: 28px; font-weight: 600; line-height: 1; margin-right: 8px; }
.biglabel { font-weight: 700; }

textarea, input[type="text"], input[type="date"], input[type="time"], select {
  width: 100%; max-width: 100%; min-width: 0; display: block;
  -webkit-appearance: none; appearance: none;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  padding: 10px 12px; font-size: 16px; min-height: 46px; text-align: left;
}
textarea { min-height: 76px; resize: vertical; line-height: 1.5; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label { font-size: 12px; color: var(--muted); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; background: var(--surface2); padding: 4px; border-radius: 12px; }
.seg button { min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.favrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.favrow:last-child { border-bottom: 0; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--rule); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabs { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; border: 0; background: transparent; border-radius: 10px; color: var(--muted); font-size: 11px; cursor: pointer; }
.tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.overlay { position: fixed; inset: 0; z-index: 30; background: var(--veil); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); border-radius: 18px 18px 0 0; padding-top: 14px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet-body { display: flex; flex-direction: column; gap: 14px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.x { width: 44px; height: 44px; border: 0; background: var(--surface2); border-radius: 50%; cursor: pointer; font-size: 16px; }
.sumline { margin: 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }

details.card > summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 700; }
.how p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-family: var(--font-num); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg i { width: 12px; height: 4px; border-radius: 2px; display: inline-block; }
.bar-row { display: grid; grid-template-columns: 3.2em minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.bar-track { height: 10px; background: var(--surface2); border-radius: 5px; overflow: hidden; }
.bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.bar-row .v { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.hbar { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.hbar .top { display: flex; justify-content: space-between; gap: 8px; }
.hbar .v { font-family: var(--font-num); font-size: 12px; color: var(--muted); white-space: nowrap; }

.sechead { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.rank { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto; column-gap: 10px; row-gap: 4px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.rank:last-child { border-bottom: 0; }
.rk { grid-row: 1 / 3; font-family: var(--font-num); font-weight: 600; color: var(--muted); text-align: center; font-size: 15px; }
.rname { grid-column: 2; overflow-wrap: anywhere; font-weight: 500; }
.rbar { grid-column: 2; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.rbar i { display: block; height: 100%; border-radius: 4px; }
.rval { grid-column: 3; grid-row: 1 / 3; text-align: right; font-family: var(--font-num); font-size: 15px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
.rval small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
.ref { font-size: 11px; font-weight: 400; color: var(--muted); border: 1px solid var(--rule); border-radius: 99px; padding: 0 6px; margin-left: 6px; white-space: nowrap; }
.chip.tg::before { content: "＋"; color: var(--muted); }
.chip.tg[aria-pressed="true"]::before { content: "✓"; font-weight: 700; color: var(--accent); }
.badge.ex { background: var(--surface2); color: var(--muted); font-weight: 500; }
.carbline { font-family: var(--font-num); font-size: 13px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper .nbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--rule); background: var(--surface); font-size: 20px; line-height: 1; cursor: pointer; }
.stepper .cnt { min-width: 3.4em; text-align: center; font-family: var(--font-num); font-size: 18px; font-weight: 600; }
.sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
.histrow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.histrow:last-child { border-bottom: 0; }
.histrow .hh { font-size: 12px; color: var(--muted); font-family: var(--font-num); }
.histrow .ht { overflow-wrap: anywhere; font-weight: 500; }
.histrow .hn { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
@media (prefers-reduced-motion: no-preference) {
  .dot .face { transition: transform 0.08s ease; }
  .bar-fill { transition: width 0.25s ease; }
}
</style>

</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>食事メーター</h1>
    <span id="status" class="status">確認中…</span>
  </div>
  <main id="view"></main>
</div>

<nav class="tabbar" aria-label="メニュー">
  <div class="tabs">
    <button type="button" class="tab" data-view="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg>今日
    </button>
    <button type="button" class="tab" data-view="review">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>振り返り
    </button>
    <button type="button" class="tab" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>設定
    </button>
  </div>
</nav>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="入力"></div>
</div>

<script>
(function () {
  'use strict';
  var APP_VERSION = '2026-10-26.10';
  var newVer = null;
  var KEY = 'shokuji-meter.v1';
  var TYPES = ['朝', '昼', '夜', '間食'];
  var WK = ['日', '月', '火', '水', '木', '金', '土'];
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  var NS = 'http://www.w3.org/2000/svg';
  var MAX_ITEMS = 12;
  var BAD = 4;
  var MOOD_LABELS = ['', '絶不調', 'かなり悪い', '悪い', 'やや悪い', 'ふつう', 'まずまず', '良い', 'かなり良い', 'とても良い', '最高潮'];
  var SCALES = [
    { key: 'mood', name: '全体の気分', lo: '絶不調', hi: '最高潮' },
    { key: 'sleep', name: '睡眠の質', lo: '最悪', hi: 'ぐっすり' },
    { key: 'drive', name: '行動力', lo: '動けない', hi: '絶好調' },
    { key: 'stress', name: 'ストレス量', lo: 'ほぼ無し', hi: '限界', inv: true },
    { key: 'nerve', name: '自律神経', lo: '副交感神経優位(リラックス)', hi: '交感神経優位(戦闘モード)', neutral: true }
  ];

  var state = null;
  var storageOK = false;
  var view = 'today';
  var day = todayStr();
  var range = 30;
  var demoOn = false;
  var demoCache = null;
  var seriesOn = { mood: true, sleep: false, drive: false, stress: false, nerve: false };
  var foodMin = 3;
  var rvTab = 'food';
  var foodAll = false;
  var dirty = false;
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- helpers ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseDate(s) { var p = s.split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
  function addDays(s, n) { var d = parseDate(s); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtLong(s) { var d = parseDate(s); return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日(' + WK[d.getDay()] + ')'; }
  function fmtShort(s) { var d = parseDate(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
  function todayStrFrom(ms) { var d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtNum(x) { return String(Math.round(x * 10) / 10); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function typeByHour(hr) { if (hr >= 4 && hr < 10) return '朝'; if (hr >= 10 && hr < 15) return '昼'; if (hr >= 15 && hr < 18) return '間食'; if (hr >= 18 && hr < 22) return '夜'; return '間食'; }

    var worst = list.filter(function (x) { return x.raw < base; }).sort(function (a, b) { return a.raw - b.raw; });
    var best = list.filter(function (x) { return x.raw >= base; }).sort(function (a, b) { return b.raw - a.raw; });
    var lim = foodAll ? 10 : 5;
    var maxAbs = Math.max(1.5, Math.max.apply(null, list.map(function (x) { return Math.abs(x.delta); })));
    function section(title, face, arr, color) {
      card.appendChild(h('div', { class: 'sechead' }, faceBadge(face, 28), h('h3', null, title)));

    }
    section('気分が低め(ワースト)', 2, worst, 'var(--c4)');

  }

  function carbCard(sm) {
    var c = chartCard('糖質・炭水化物の量と気分', '入力した食事を、量(g)ごとに分けて、食事ごとの「一番悪かった気分」の平均を比べます。入力は、わかるときだけで大丈夫です。');
    var edges = [20, 40, 60, 80, 100];
    var labels = ['20g未満', '20〜40g', '40〜60g', '60〜80g', '80〜100g', '100g以上'];
    [['carbs', '糖質'], ['starch', '炭水化物']].forEach(function (p) {
      var withV = sm.filter(function (x) { return x.m[p[0]] != null; });
      if (withV.length < 8) { c.appendChild(h('p', { class: 'hint' }, p[1] + ': 入力のある食事があと ' + (8 - withV.length) + '食たまると、比較が出ます。')); return; }
      c.appendChild(h('div', { class: 'sub' }, p[1] + '(入力のある食事 ' + withV.length + '食)'));
      labels.forEach(function (lb, k) {
        var lo = k === 0 ? -1 : edges[k - 1], hi = k < edges.length ? edges[k] : Infinity;
        var grp = withV.filter(function (x) { var v = x.m[p[0]]; return v >= lo && v < hi && (k > 0 || v < hi); });
        if (k === 0) grp = withV.filter(function (x) { return x.m[p[0]] < edges[0]; });
        if (grp.length) c.appendChild(avgRow(lb, grp));
      });
    });
    return c;
  }

  function condCard(data, sm) {

      ['ストレス', [['弱い日(5以下)', function (x) { var d = dd(x); return d && d.stress != null && d.stress <= 5; }], ['強い日(6以上)', function (x) { var d = dd(x); return d && d.stress != null && d.stress >= 6; }]]],
      ['運動', [['運動した日', function (x) { var d = dd(x); return d && d.exercise; }], ['運動しなかった日', function (x) { var d = dd(x); return d && !d.exercise; }]]],

      ['自律神経', [['交感神経が優位な日(7以上)', function (x) { var d = dd(x); return d && d.nerve != null && d.nerve >= 7; }], ['副交感神経が優位な日(4以下)', function (x) { var d = dd(x); return d && d.nerve != null && d.nerve <= 4; }]]],
      ['コーヒー', [['飲まなかった日', function (x) { var d = dd(x); return d && !d.coffee; }], ['1杯未満の日', function (x) { var d = dd(x); return d && d.coffee > 0 && d.coffee < 1; }], ['1杯以上2杯未満の日', function (x) { var d = dd(x); return d && d.coffee >= 1 && d.coffee < 2; }], ['2杯以上3杯未満の日', function (x) { var d = dd(x); return d && d.coffee >= 2 && d.coffee < 3; }], ['3杯以上の日', function (x) { var d = dd(x); return d && d.coffee >= 3; }]]],

    return c;
  }

  function typeCard(sm) {

  function hoursCard(data) {
    var c = chartCard('食後の時間ごと', '食べてから何時間後の気分か(平均)。');

    });

  function trendCard(data) {
    var c2 = chartCard('1日のまとめの推移', '日ごとの全体の気分・睡眠・行動力・ストレス・自律神経(ストレスは高いほど強く、自律神経は高いほど交感神経が優位)。');

    for (var i = range - 1; i >= 0; i--) dates.push(addDays(todayStr(), -i));

    if (!anyDay) { c2.appendChild(h('p', { class: 'empty' }, 'この期間に、1日のまとめの記録がありません。')); return c2; }
    var xs = dates.map(function (dt, idx) { return (idx === 0 || idx === dates.length - 1 || idx === Math.floor(dates.length / 2)) ? fmtShort(dt) : ''; });

    })));

        var json = backupJson();
        function ok() { backupDone('全データをコピーしました。メモアプリなどに貼り付けて保管してください。'); }
        function fallback() { paste.value = json; paste.focus(); paste.select(); setMsg('自動コピーできませんでした。下の欄を長押ししてコピーしてください。', true); }
        try { navigator.clipboard.writeText(json).then(ok, fallback); } catch (e) { fallback(); }
      } }, '全データをコピー'),
      h('div', { class: 'field' }, h('label', { for: 's-paste' }, '復元する内容を貼り付け'), paste),
      h('button', { type: 'button', class: 'ghost', onClick: function () {
        var t = paste.value.trim();
        if (!t) { setMsg('貼り付け欄が空です。', true); return; }
        doImport(t);
      } }, '取り込む(いまのデータに追加)'),
      bMsg));

    v.appendChild(h('section', { class: 'card' },
      h('h2', null, 'このアプリについて'),
      h('p', { class: 'hint' }, '食事と気分を並べて振り返るための記録帳です。血糖値は測定しません。医療的な判断や診断には使えません。体調に不安があるときは、医師に相談してください。'),
      h('p', { class: 'hint' }, '入力したデータは、この端末のブラウザ内だけに保存され、インターネットには送信されません。')));

    v.appendChild(h('section', { class: 'card' },
      h('h2', null, 'すべてのデータを削除'),
      h('p', { class: 'hint' }, 'この端末のこのアプリに保存された記録を、すべて消します。元に戻せません。'),
      confirmButton('すべて削除する', '本当に削除する?', function () {
        state = emptyState(); persist(); day = todayStr(); render();
      })));
  }

  /* ---------- boot ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.addEventListener('click', function () { setView(t.getAttribute('data-view')); });
  });
  $('overlay').addEventListener('click', function (e) { if (e.target === $('overlay')) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('overlay').hidden) closeSheet(); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && dirty) persist(); });
  window.addEventListener('pagehide', function () { if (dirty) persist(); });

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  state = load();
  render();

  function checkUpdate() {
    if (!/^https?:$/.test(location.protocol) || typeof fetch !== 'function') return;
    try {
      fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
        var m = /APP_VERSION = '([^']+)'/.exec(t || '');
        if (m && m[1] !== APP_VERSION) { newVer = m[1]; if (view === 'today' && $('overlay').hidden) keepScrollRender(); }
      }).catch(function () {});
    } catch (e) {}
  }
  checkUpdate();
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') checkUpdate(); });
})();
</script>
</body>
</html>
